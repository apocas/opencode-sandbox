name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write      # create the release
  id-token: write      # sign the provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          grep -q "^const Version = \"$v\"$" internal/core/core.go \
            || { echo "tag $GITHUB_REF_NAME doesn't match Version in internal/core/core.go" >&2; exit 1; }
          mkdir dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" \
                -o "dist/opencode-sandbox_${v}_${os}_${arch}" ./cmd/opencode-sandbox
            done
          done
          (cd dist && sha256sum opencode-sandbox_* > SHA256SUMS)
          # This version's section of the changelog, without its heading.
          awk -v v="$v" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $v" >&2; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/opencode-sandbox_*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
