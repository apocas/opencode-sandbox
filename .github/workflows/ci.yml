name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The install script, for real: the latest release, into a scratch
      # folder (ubuntu's sh is dash, macOS's is bash).
      - name: install.sh
        run: |
          if command -v shellcheck >/dev/null; then shellcheck install.sh; fi
          OPENCODE_SANDBOX_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/opencode-sandbox" version

  # Every command against a real Docker (rootful, so the host ssh-agent mode
  # is used), and against sandboxes made by the bash launcher of v0.4.0; then
  # after `opencode-sandbox setup` has installed gVisor: on the runtime new
  # sandboxes get by themselves (host ssh-agent), and on the one without host
  # sockets, asked for (disposable keys inside).
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker
          - name: gvisor
            setup: true
            expect: runsc-ssh
          - name: gvisor, no host sockets
            setup: true
            runtime: runsc
    name: integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o .bin/opencode-sandbox ./cmd/opencode-sandbox
      - name: opencode-sandbox setup
        if: matrix.setup
        run: |
          .bin/opencode-sandbox health | grep -A3 '^Next step'
          .bin/opencode-sandbox setup -y
          docker info --format '{{json .Runtimes}}'
          .bin/opencode-sandbox setup | grep 'nothing to set up'
          .bin/opencode-sandbox health | grep 'boundary   gVisor (runtime runsc-ssh, used because Docker has it)'
      - run: git worktree add /tmp/v040 v0.4.0
      - run: test/integration.sh .bin/opencode-sandbox ${{ matrix.name == 'docker' && '/tmp/v040/opencode-sandbox' || '' }}
        env:
          OPENCODE_SANDBOX_RUNTIME: ${{ matrix.runtime }}
          EXPECT_RUNTIME: ${{ matrix.expect }}
