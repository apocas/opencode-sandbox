<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 692" width="880" height="692" role="img" aria-labelledby="t d">
  <title id="t">What a sandbox gets from your machine</title>
  <desc id="d">Of your folders, SSH keys, LLM providers and API keys, a sandbox gets a copy of one folder, a new disposable key of its own instead of any of yours, and the providers you pick. It gets none of your API keys: it has a token, and every request it makes goes out through a gateway on your machine that swaps the token for the real key. opencode runs behind a wall: a hardened Docker container, or after opencode-sandbox setup a gVisor kernel of its own on Linux or an Apple container VM of its own on a Mac.</desc>
  <!-- overview-light.svg is this file with another palette: change both. -->
  <style>
    /* palette */
    .bg{fill:#0d1117;stroke:#30363d}
    .panel{fill:#151b23;stroke:#30363d}
    .wall{fill:#0f2417;stroke:#3fb950}
    .wall-in{fill:none;stroke:#3fb950}
    .card{fill:#0d1117;stroke:#28603a}
    .ink{fill:#f0f6fc}
    .muted{fill:#9198a1}
    .hot{fill:#3fb950}
    .on-hot{fill:#0d1117}
    .tile{fill:#0d1117;stroke:#30363d}
    .tile-hot{fill:#12361e;stroke:#3fb950}
    .ico{stroke:#545d68}
    .ico-hot{stroke:#3fb950}
    .flow{stroke:#3fb950}
    .tag{fill:#0d1117;stroke:#3fb950}
    .tag-off{fill:#0d1117;stroke:#30363d}
    .term{fill:#010409;stroke:#3d444d}
    .term-t{fill:#f0f6fc}
    .term-p{fill:#3fb950}
    /* end palette */
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .cap{font-size:12px;font-weight:600;letter-spacing:.12em}
    .t{font-size:16px;font-weight:600}
    .s{font-size:14px}
    .l{font-size:13px}
    .b{font-weight:600}
    .new{font-size:9px;font-weight:700;letter-spacing:.06em}
    .flow{fill:none;stroke-width:2;stroke-linecap:round}
    .dot{animation:go 2.8s ease-in-out infinite;opacity:0}
    .d2{animation-delay:.6s}
    .d3{animation-delay:1.2s}
    .d4{animation-name:out;animation-delay:1.8s}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes go{0%{transform:translateX(0);opacity:0}12%{opacity:1}70%{opacity:1}85%,100%{transform:translateX(180px);opacity:0}}
    @keyframes out{0%{transform:translateX(0);opacity:0}12%{opacity:1}70%{opacity:1}85%,100%{transform:translateX(-180px);opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.dot,.cur{animation:none}}
  </style>
  <defs>
    <g id="folder" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M3 7.5a2 2 0 0 1 2-2h4.2l2.2 2.4H19a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </g>
    <g id="key" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="7.5" cy="12" r="4"/>
      <path d="M11.5 12H21M17.5 12v3.4M21 12v3.4"/>
    </g>
    <g id="llm" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 3.5C12.6 8.6 15.4 11.4 20.5 12 15.4 12.6 12.6 15.4 12 20.5 11.4 15.4 8.6 12.6 3.5 12 8.6 11.4 11.4 8.6 12 3.5z"/>
    </g>
    <g id="secret" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="2.5" y="7" width="19" height="10" rx="3"/>
      <path d="M7.5 12h.01M12 12h.01M16.5 12h.01" stroke-width="2.4"/>
    </g>
    <g id="gate" fill="none" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 9h15M15.5 5.5 19 9l-3.5 3.5M20 15H5M8.5 11.5 5 15l3.5 3.5"/>
    </g>
  </defs>

  <rect class="bg" x=".5" y=".5" width="879" height="691" rx="14"/>

  <!-- your machine -->
  <rect class="panel" x="28" y="28" width="338" height="468" rx="12"/>
  <text class="cap muted" x="48" y="58">YOUR MACHINE</text>

  <text class="l muted" x="48" y="90">Folders</text>
  <rect class="tile" x="48" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico" x="56" y="108"/>
  <rect class="tile" x="96" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico" x="104" y="108"/>
  <rect class="tile" x="144" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico" x="152" y="108"/>
  <rect class="tile" x="192" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico" x="200" y="108"/>
  <rect class="tile" x="240" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico" x="248" y="108"/>
  <rect class="tile-hot" x="288" y="100" width="40" height="40" rx="8"/><use href="#folder" class="ico-hot" x="296" y="108"/>

  <text class="l muted" x="48" y="186">SSH keys</text>
  <rect class="tile" x="48" y="196" width="40" height="40" rx="8"/><use href="#key" class="ico" x="56" y="204"/>
  <rect class="tile" x="96" y="196" width="40" height="40" rx="8"/><use href="#key" class="ico" x="104" y="204"/>
  <rect class="tile" x="144" y="196" width="40" height="40" rx="8"/><use href="#key" class="ico" x="152" y="204"/>
  <rect class="tile" x="192" y="196" width="40" height="40" rx="8"/><use href="#key" class="ico" x="200" y="204"/>
  <rect class="tile" x="240" y="196" width="40" height="40" rx="8"/><use href="#key" class="ico" x="248" y="204"/>
  <rect class="tile-hot" x="288" y="196" width="40" height="40" rx="8" stroke-dasharray="4 3"/><use href="#key" class="ico-hot" x="296" y="204"/>
  <rect class="hot" x="291" y="188" width="34" height="15" rx="7.5"/><text class="new on-hot" x="308" y="199" text-anchor="middle">NEW</text>

  <text class="l muted" x="48" y="282">LLM providers</text>
  <rect class="tile" x="48" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico" x="56" y="300"/>
  <rect class="tile" x="96" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico" x="104" y="300"/>
  <rect class="tile" x="144" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico" x="152" y="300"/>
  <rect class="tile" x="192" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico" x="200" y="300"/>
  <rect class="tile" x="240" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico" x="248" y="300"/>
  <rect class="tile-hot" x="288" y="292" width="40" height="40" rx="8"/><use href="#llm" class="ico-hot" x="296" y="300"/>

  <text class="l muted" x="48" y="378">API keys</text>
  <rect class="tile" x="48" y="388" width="40" height="40" rx="8"/><use href="#secret" class="ico" x="56" y="396"/>
  <rect class="tile" x="96" y="388" width="40" height="40" rx="8"/><use href="#secret" class="ico" x="104" y="396"/>
  <rect class="tile" x="144" y="388" width="40" height="40" rx="8"/><use href="#secret" class="ico" x="152" y="396"/>
  <rect class="tile" x="192" y="388" width="40" height="40" rx="8"/><use href="#secret" class="ico" x="200" y="396"/>
  <rect class="tile" x="240" y="388" width="40" height="40" rx="8"/><use href="#secret" class="ico" x="248" y="396"/>
  <rect class="tile-hot" x="288" y="388" width="40" height="40" rx="8"/><use href="#gate" class="ico-hot" x="296" y="396"/>
  <rect class="hot" x="277" y="380" width="62" height="15" rx="7.5"/><text class="new on-hot" x="308" y="391" text-anchor="middle">GATEWAY</text>

  <text class="s muted" x="48" y="474">Everything in grey stays out.</text>

  <!-- the sandbox: its border is the wall -->
  <rect class="wall" x="514" y="28" width="338" height="468" rx="12" stroke-width="2"/>
  <rect class="wall-in" x="519.5" y="33.5" width="327" height="457" rx="8" opacity=".45"/>
  <text class="cap hot" x="536" y="58">SANDBOX</text>
  <rect class="term" x="718" y="40" width="114" height="28" rx="7"/>
  <text class="mono" x="729" y="58.5" font-size="13" textLength="78"><tspan class="term-p">$</tspan><tspan class="term-t"> opencode</tspan></text>
  <rect class="term-t cur" x="811" y="47" width="7" height="14" rx="1"/>

  <text class="cap hot" x="492" y="58" text-anchor="end">THE WALL</text>
  <path class="flow" d="M498 54h15" stroke-width="1.5"/>

  <rect class="card" x="534" y="82" width="298" height="76" rx="8"/>
  <text class="mono t ink" x="550" y="114">/workspace</text>
  <text class="s muted" x="550" y="137">the original is never touched</text>
  <use href="#folder" class="ico-hot" x="792" y="108"/>

  <rect class="card" x="534" y="178" width="298" height="76" rx="8"/>
  <text class="mono t ink" x="550" y="210">ssh</text>
  <text class="s muted" x="550" y="233">its own key, deleted with it</text>
  <use href="#key" class="ico-hot" x="792" y="204"/>

  <rect class="card" x="534" y="274" width="298" height="76" rx="8"/>
  <text class="mono t ink" x="550" y="306">opencode.json</text>
  <text class="s muted" x="550" y="329">no other provider is enabled</text>
  <use href="#llm" class="ico-hot" x="792" y="300"/>

  <rect class="card" x="534" y="370" width="298" height="76" rx="8"/>
  <text class="mono t ink" x="550" y="402">token</text>
  <text class="s muted" x="550" y="425">swapped for the real key, outside</text>
  <use href="#secret" class="ico-hot" x="792" y="396"/>

  <text class="s muted" x="536" y="474">In here, the agent may run anything.</text>

  <!-- what crosses the wall -->
  <path class="flow" d="M336 120H525"/><path class="hot" d="M535 120l-11-5.5v11z"/>
  <text class="l b ink" x="440" y="110" text-anchor="middle">one, as a copy</text>
  <path class="flow" d="M336 216H525"/><path class="hot" d="M535 216l-11-5.5v11z"/>
  <text class="l b ink" x="440" y="206" text-anchor="middle">a disposable one</text>
  <path class="flow" d="M336 312H525"/><path class="hot" d="M535 312l-11-5.5v11z"/>
  <text class="l b ink" x="440" y="302" text-anchor="middle">the ones you pick</text>
  <path class="flow" d="M346 408H534"/><path class="hot" d="M335 408l11-5.5v11z"/>
  <text class="l b ink" x="440" y="398" text-anchor="middle">every request</text>
  <circle class="hot dot" cx="340" cy="120" r="4"/>
  <circle class="hot dot d2" cx="340" cy="216" r="4"/>
  <circle class="hot dot d3" cx="340" cy="312" r="4"/>
  <circle class="hot dot d4" cx="528" cy="408" r="4"/>

  <!-- how strong the wall is -->
  <rect class="wall" x="28" y="522" width="16" height="13" rx="3.5" stroke-width="2"/>
  <text class="cap muted" x="54" y="533">HOW STRONG IS THE WALL?</text>
  <text class="l" x="852" y="533" text-anchor="end"><tspan class="mono b hot">opencode-sandbox health</tspan><tspan class="muted"> shows yours</tspan></text>

  <rect class="panel" x="28" y="550" width="230" height="114" rx="10"/>
  <text class="t ink" x="48" y="586">Docker</text>
  <rect class="tag-off" x="170" y="569" width="74" height="22" rx="11"/>
  <text class="l muted" x="207" y="584.5" text-anchor="middle">anywhere</text>
  <text class="s muted" x="48" y="614">a hardened container</text>
  <text class="s muted" x="48" y="635">on a shared kernel</text>

  <path class="flow" d="M258 607H470"/>
  <path class="flow" d="M470 607C492 607 488 575.5 510 575.5"/><path class="hot" d="M520 575.5l-11-5.5v11z"/>
  <path class="flow" d="M470 607C492 607 488 638.5 510 638.5"/><path class="hot" d="M520 638.5l-11-5.5v11z"/>
  <text class="mono b hot" x="364" y="596" font-size="13" text-anchor="middle">opencode-sandbox setup</text>
  <text class="l muted" x="364" y="628" text-anchor="middle">installs the strongest one</text>

  <rect class="wall" x="520" y="550" width="332" height="51" rx="10" stroke-width="1.5"/>
  <rect class="tag" x="534" y="564.5" width="50" height="22" rx="11"/>
  <text class="l b hot" x="559" y="580" text-anchor="middle">Linux</text>
  <text class="t ink" x="596" y="581">gVisor</text>
  <text class="s muted" x="838" y="580.5" text-anchor="end">a kernel of its own</text>

  <rect class="wall" x="520" y="613" width="332" height="51" rx="10" stroke-width="1.5"/>
  <rect class="tag" x="534" y="627.5" width="50" height="22" rx="11"/>
  <text class="l b hot" x="559" y="643" text-anchor="middle">Mac</text>
  <text class="t ink" x="596" y="644">Apple container</text>
  <text class="s muted" x="838" y="643.5" text-anchor="end">a VM of its own</text>
</svg>
